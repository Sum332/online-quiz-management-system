<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Question</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    
    <nav class="nav">
        <a href="/admin">Admin Dashboard</a>
        <a href="/add_question">Add Question</a>
        <a href="/view_questions">View Questions</a>
        <a href="/logout">Logout</a>
    </nav>

    <div class="container">

        <div class="card">

            <h1>✏️ Edit Quiz Question</h1>

            <form method="POST">

                <label>Question:</label>

                <textarea name="question" required>{{ question.question }}</textarea>


                <label>Option A:</label>

                <input
                    type="text"
                    name="option_a"
                    value="{{ question.option_a }}"
                    required
                >


                <label>Option B:</label>

                <input
                    type="text"
                    name="option_b"
                    value="{{ question.option_b }}"
                    required
                >


                <label>Option C:</label>

                <input
                    type="text"
                    name="option_c"
                    value="{{ question.option_c }}"
                    required
                >


                <label>Option D:</label>

                <input
                    type="text"
                    name="option_d"
                    value="{{ question.option_d }}"
                    required
                >


                <label>Correct Answer:</label>

                <select name="correct_answer" required>

                    <option value="">Select Correct Answer</option>

                    <option value="A"
                        {% if question.correct_answer == "A" %}selected{% endif %}>
                        Option A
                    </option>

                    <option value="B"
                        {% if question.correct_answer == "B" %}selected{% endif %}>
                        Option B
                    </option>

                    <option value="C"
                        {% if question.correct_answer == "C" %}selected{% endif %}>
                        Option C
                    </option>

                    <option value="D"
                        {% if question.correct_answer == "D" %}selected{% endif %}>
                        Option D
                    </option>

                </select>


                <button type="submit">
                    ✏️ Update Question
                </button>

            </form>

            <br>

            <a href="/view_questions" class="btn">
                ⬅️ Back to Questions
            </a>

        </div>

    </div>

</body>
</html>
