<!DOCTYPE html>
<html>
<head>
    <title>Live Quiz Results</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">

        <h2>🎮 Live Quiz Results</h2>

        {% for result in results %}

        <div class="question-card">

            <h3>👤 {{ result.student_name }}</h3>

            <p>🏆 Score: {{ result.score }} /
                {{ result.total_questions }}</p>

            <p>📅 Joined: {{ result.joined_at }}</p>

        </div>

        {% else %}

        <p>No students have completed the quiz yet.</p>

        {% endfor %}

    </div>
</div>

</body>
</html>
