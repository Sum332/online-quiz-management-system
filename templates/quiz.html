<!DOCTYPE html>
<html>
<head>
    <title>Quiz - Online Quiz Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/result_history">My Results</a>
    <a href="/logout">Logout</a>
</nav>

<div class="container">

    <div class="card quiz-card">

        <h1>📝 Online Quiz</h1>

        <p class="quiz-subtitle">
            Choose the correct answer for each question.
        </p>

        <!-- TIMER -->
        <div class="quiz-timer">
            ⏱️ Time Remaining:
            <span id="timer">Loading...</span>
        </div>

        <!-- QUIZ FORM -->
        <form method="POST" id="quizForm">

            {% for question in questions %}

            <div class="question-box">

                <h2>
                    Question {{ loop.index }}
                </h2>

                <p class="question-text">
                    {{ question.question }}
                </p>

                <!-- OPTION A -->
                <label class="option">

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="A"
                        data-question-id="{{ question.id }}"
                        required
                    >

                    <span>
                        A. {{ question.option_a }}
                    </span>

                </label>

                <!-- OPTION B -->
                <label class="option">

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="B"
                        data-question-id="{{ question.id }}"
                    >

                    <span>
                        B. {{ question.option_b }}
                    </span>

                </label>

                <!-- OPTION C -->
                <label class="option">

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="C"
                        data-question-id="{{ question.id }}"
                    >

                    <span>
                        C. {{ question.option_c }}
                    </span>

                </label>

                <!-- OPTION D -->
                <label class="option">

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="D"
                        data-question-id="{{ question.id }}"
                    >

                    <span>
                        D. {{ question.option_d }}
                    </span>

                </label>

            </div>

            {% endfor %}

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="submit-btn">
                Submit Quiz
            </button>

        </form>

    </div>

</div>


<!-- =========================
     ADMIN SET TIMER
========================= -->

<script>

    // Admin dashboard in quiz time
    let timeLeft = parseInt("{{ quiz_time }}") * 60;

    const timer = document.getElementById("timer");
    const quizForm = document.getElementById("quizForm");

    const countdown = setInterval(function () {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        seconds = seconds < 10
            ? "0" + seconds
            : seconds;

        timer.textContent = minutes + ":" + seconds;


        // Time End
        if (timeLeft <= 0) {

            clearInterval(countdown);

            timer.textContent = "Time Up!";

            quizForm.submit();

            return;
        }

        timeLeft--;

    }, 1000);
    
</script>

</body>
</html>
