<!DOCTYPE html>
<html>
<head>
    <title>Join Live Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">

        <h2>🎮 Join Live Quiz</h2>

        <form method="POST">

            <input
                type="text"
                name="game_pin"
                placeholder="Enter Game PIN"
                required
            >

            <button type="submit" class="btn">
                Join Quiz
            </button>

        </form>

    </div>
</div>

</body>
</html>
